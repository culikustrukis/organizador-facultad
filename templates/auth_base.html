<!DOCTYPE html>
<html lang="es" class="{% if current_user and current_user['theme'] == 'dark' %}dark{% endif %}">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>{% block title %}Organizador Facultad{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/tailwind.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col">

<header class="h-16 flex items-center justify-between px-space-lg border-b border-outline-variant/20 bg-surface-container-lowest/60 backdrop-blur-md sticky top-0 z-40" id="auth-header">
  <a class="flex items-center gap-space-sm" href="{{ url_for('login') }}">
    <img alt="Organizador Facultad" class="h-8 w-auto object-contain" src="{{ url_for('static', filename='img/logo.svg') }}">
    <div class="flex flex-col">
      <span class="font-headline-sm text-[16px] text-on-surface font-bold leading-tight">Organizador Facultad</span>
      <span class="font-label-sm text-[11px] text-on-surface-variant leading-tight">Student Planner</span>
    </div>
  </a>
  <nav class="flex items-center gap-1">
    <a class="px-3 py-2 rounded-lg {% if active == 'ingreso' %}bg-primary-container text-on-primary-container font-semibold{% else %}text-on-surface-variant hover:bg-surface-container transition-colors{% endif %} font-body-md text-[13px]" href="{{ url_for('login') }}">Iniciar Sesión</a>
    <a class="px-3 py-2 rounded-lg {% if active == 'registro' %}bg-primary-container text-on-primary-container font-semibold{% else %}text-on-surface-variant hover:bg-surface-container transition-colors{% endif %} font-body-md text-[13px]" href="{{ url_for('register') }}">Crear Cuenta</a>
  </nav>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-10">
  {% block content %}{% endblock %}
</main>

<footer class="py-5 border-t border-outline-variant/20 bg-surface-container-low/30">
  <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-on-surface-variant font-label-sm text-[12px]">
    <span>Organizador Facultad · Student Planner</span>
    <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">school</span> Hecho para estudiantes</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
